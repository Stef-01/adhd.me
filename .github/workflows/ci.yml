name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # This job runs `pnpm verify` — the one script — and nothing of its own. A list that is
  # copied drifts; a list that is called cannot.
  #
  # The toolchain is read from the tree's pins, not restated: pnpm/action-setup takes the
  # version from package.json's `packageManager` (giving it a `version` here as well is an
  # error in that action, by design), and setup-node reads `.nvmrc`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Until this job existed nothing ran `pnpm e2e` — not `verify`, not CI — so every
  # browser-level sweep guarded only whatever a person remembered to run, and a compliance
  # spec sat red for days with nobody watching. Code with no gate is a comment.
  #
  # It is a SEPARATE job on purpose. The suite drives its own production build and takes
  # minutes; hanging that off the fast gate would tempt somebody to trim the fast gate.
  # Two jobs means a failure in either is visible on its own, and `verify` still answers
  # in the time it always did.
  e2e:
    runs-on: ubuntu-latest
    # The suite measures ~8 minutes locally plus its own `next build`; the ceiling is
    # generous so a slow runner reports a real result rather than a timeout that reads
    # like a product failure.
    #
    # 2026-09-11: it had stopped being generous, and the failure it was written to prevent is
    # exactly the one it started causing. On the eight most recent pushes to main the job was
    # CANCELLED at this ceiling, and the last of them (ddea8c7, this branch's base) shows what
    # that means: 342 tests passed, none failed, and the wall clock ran out with about three
    # left — `pnpm e2e` ran 23:30:40 to 00:00:10, the full thirty minutes. Nothing was broken
    # and no run could say so, on any branch, for a day. The suite simply outgrew the number
    # while the comment above kept describing the number as roomy.
    #
    # 45 puts about fourteen minutes back between the suite and the ceiling. Sharding it across
    # jobs would buy more, and is the real answer if it outgrows this too — but not for free:
    # playwright.config.ts pins `workers: 1` because the mock rail, console and audit stores are
    # process-global singletons, so splitting the suite is a correctness change, not a config one.
    #
    # 2026-09-22: it happened again. Three sweeps landed in one day (reduced motion, focus rings,
    # axe over the stateful screens), the suite reached 44.4 minutes with every test passing, and
    # the last three pushes to main and this branch's own run were all cancelled at 45 with
    # nothing failed. 75 puts about half an hour back. The next time this number is the reason
    # a run is red, shard the suite rather than raise it again.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Chromium only. The suite pins one engine (playwright.config.ts launches it and
      # falls back to a pre-provisioned binary when the pinned revision is missing), so
      # installing firefox and webkit would buy nothing and cost minutes on every run.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts owns the server: it runs `next build && next start` on its
      # own port with the env the production build fails closed without. Nothing to
      # start here.
      - run: pnpm e2e
        env:
          CI: "true"
      # A red compliance gate has to be diagnosable from the run that caught it, or the
      # next person's first move is to re-run it locally and hope.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
