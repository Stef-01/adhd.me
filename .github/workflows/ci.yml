name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # U5: this job runs `pnpm verify` — the one script — and nothing of its own. Until U5 it
  # restated four of verify's six steps by hand and had silently fallen behind: `perf:gate`
  # (route budgets) and `gate:accounting` (the ledger's green must account for every e2e
  # test) ran on a developer's machine and never here. A list that is copied drifts; a list
  # that is called cannot. src/quality/ci-parity.test.ts holds the two together in both
  # directions, so a step added to verify without reaching CI, or a step run here that
  # verify does not know, is a failing test rather than a quiet gap.
  #
  # The toolchain is read from the tree's pins, not restated: pnpm/action-setup takes the
  # version from package.json's `packageManager` (giving it a `version` here as well is an
  # error in that action, by design), and setup-node reads `.nvmrc`. Bumping either pin is
  # one edit, and the same test checks the pins agree with `engines`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # O98 (standing debt 11). Until this job existed, NOTHING ran `pnpm e2e` — not
  # `verify`, not CI — so every browser-level sweep guarded only whatever a person
  # remembered to run. That is how O97 happened: `party-to-care.spec.ts`, which reads
  # every rendered page for ADHD.ME holding itself out as a carer, sat red on /privacy
  # with nobody watching. "Compliance is code" is this tree's law, and code with no gate
  # is a comment.
  #
  # It is a SEPARATE job on purpose. The suite drives its own production build and takes
  # minutes; hanging that off the fast gate would tempt somebody to trim the fast gate.
  # Two jobs means a failure in either is visible on its own, and `verify` still answers
  # in the time it always did.
  e2e:
    runs-on: ubuntu-latest
    # The suite measures ~8 minutes locally plus its own `next build`; the ceiling is
    # generous so a slow runner reports a real result rather than a timeout that reads
    # like a product failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Chromium only. The suite pins one engine (playwright.config.ts launches it and
      # falls back to a pre-provisioned binary when the pinned revision is missing), so
      # installing firefox and webkit would buy nothing and cost minutes on every run.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts owns the server: it runs `next build && next start` on its
      # own port with the env the production build fails closed without. Nothing to
      # start here.
      - run: pnpm e2e
        env:
          CI: "true"
      # A red compliance gate has to be diagnosable from the run that caught it, or the
      # next person's first move is to re-run it locally and hope.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
